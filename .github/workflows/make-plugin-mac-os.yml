name: Make macOS Plugin

on:
  push:
    paths:
      - .github/workflows/make-plugin-mac-os.yml
  pull_request:
    paths:
      - .github/workflows/make-plugin-mac-os.yml
  workflow_dispatch:
    inputs:
      version_number:
        description: 'Version number'
        required: true
        default: '2.x.x'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Compute VERSION_NUMBER
        run: |
          INPUT_VERSION="${{ github.event.inputs.version_number }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${VERSION//\//-}"
          echo "VERSION_NUMBER=$VERSION" >> "$GITHUB_ENV"
          echo "Computed VERSION_NUMBER=$VERSION"
          
      - name: Install Bazelisk (Bazel)
        run: |
          brew update
          brew install bazelisk
          bazelisk version
          
      - name: Build protoc-gen-grpc-web for Intel (x86_64)
        run: |
          bazelisk build //javascript/net/grpc/web/generator:protoc-gen-grpc-web --macos_cpus=x86_64
          mv bazel-bin/javascript/net/grpc/web/generator/protoc-gen-grpc-web \
            ./protoc-gen-grpc-web-${VERSION_NUMBER}-darwin-x86_64
            
      - name: Build protoc-gen-grpc-web for Apple Silicon (arm64)
        run: |
          bazelisk build //javascript/net/grpc/web/generator:protoc-gen-grpc-web
          mv bazel-bin/javascript/net/grpc/web/generator/protoc-gen-grpc-web \
            ./protoc-gen-grpc-web-${VERSION_NUMBER}-darwin-aarch64
            
      - name: Generate sha256
        run: |
          openssl dgst -sha256 -r -out protoc-gen-grpc-web-${VERSION_NUMBER}-darwin-x86_64.sha256 \
            protoc-gen-grpc-web-${VERSION_NUMBER}-darwin-x86_64
          openssl dgst -sha256 -r -out protoc-gen-grpc-web-${VERSION_NUMBER}-darwin-aarch64.sha256 \
            protoc-gen-grpc-web-${VERSION_NUMBER}-darwin-aarch64
            
      - name: Verify sha256
        run: |
          shasum -a 256 -c protoc-gen-grpc-web-${VERSION_NUMBER}-darwin-x86_64.sha256
          shasum -a 256 -c protoc-gen-grpc-web-${VERSION_NUMBER}-darwin-aarch64.sha256
          
      - name: Upload artifacts (Intel)
        uses: actions/upload-artifact@v4
        with:
          name: protoc-gen-grpc-web-${{ env.VERSION_NUMBER }}-darwin-x86_64
          path: |
            protoc-gen-grpc-web-${{ env.VERSION_NUMBER }}-darwin-x86_64
            protoc-gen-grpc-web-${{ env.VERSION_NUMBER }}-darwin-x86_64.sha256

      - name: Upload artifacts (Apple Silicon)
        uses: actions/upload-artifact@v4
        with:
          name: protoc-gen-grpc-web-${{ env.VERSION_NUMBER }}-darwin-aarch64
          path: |
            protoc-gen-grpc-web-${{ env.VERSION_NUMBER }}-darwin-aarch64
            protoc-gen-grpc-web-${{ env.VERSION_NUMBER }}-darwin-aarch64.sha256
